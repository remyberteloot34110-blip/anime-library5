const KEY='sakura_anime_library_v2';
let items=[],tab='Tous',favOnly=false,page=0,editId=null;
const $=id=>document.getElementById(id), perPage=24;
function norm(x,i){return {id:Number(x.id)||i+1,title:String(x.title||x.name||'Anime sans titre'),status:['Vu','En cours','À voir'].includes(x.status)?x.status:(x.status==='Watching'?'En cours':x.status==='Plan to Watch'?'À voir':'Vu'),rating:Math.max(0,Math.min(10,Number(x.rating)||0)),favorite:!!(x.favorite??x.fav),notes:String(x.notes||'')}}

function persist(render=true){localStorage.setItem(KEY,JSON.stringify(items));if(render)draw()}
function stats(){ $('total').textContent=items.length;$('favorites').textContent=items.filter(x=>x.favorite).length;let rated=items.filter(x=>x.rating>0);$('average').textContent=rated.length?(rated.reduce((s,x)=>s+x.rating,0)/rated.length).toFixed(1):'—'}
function filtered(){let q=$('search').value.trim().toLocaleLowerCase('fr'),list=items.filter(x=>(tab==='Tous'||x.status===tab)&&(!favOnly||x.favorite)&&x.title.toLocaleLowerCase('fr').includes(q));let sort=$('sort').value;if(sort==='az')list.sort((a,b)=>a.title.localeCompare(b.title,'fr'));if(sort==='za')list.sort((a,b)=>b.title.localeCompare(a.title,'fr'));if(sort==='rating')list.sort((a,b)=>b.rating-a.rating||a.title.localeCompare(b.title,'fr'));if(sort==='recent')list.sort((a,b)=>b.id-a.id);return list}
function draw(){stats();let list=filtered(),max=Math.max(1,Math.ceil(list.length/perPage));page=Math.min(page,max-1);$('page').textContent=(page+1)+' / '+max;$('resultCount').textContent=list.length+' anime affiché(s)';$('grid').innerHTML='';$('empty').hidden=list.length!==0;list.slice(page*perPage,(page+1)*perPage).forEach(x=>{let card=document.createElement('article');card.className='card';card.innerHTML=`<div class="poster">🌸</div><div class="cardbody"><h3></h3><select aria-label="Statut"><option>Vu</option><option>En cours</option><option>À voir</option></select><input type="number" min="0" max="10" step=".5" aria-label="Note sur 10" placeholder="Note /10"><div class="actions"><span class="rating"></span><button class="heart" aria-label="Favori">♡</button><button class="btn alt edit">Modifier</button></div></div>`;card.querySelector('h3').textContent=x.title;let s=card.querySelector('select');s.value=x.status;s.onchange=()=>{x.status=s.value;persist()};let r=card.querySelector('input');r.value=x.rating||'';r.onchange=()=>{x.rating=Math.max(0,Math.min(10,Number(r.value)||0));persist()};card.querySelector('.rating').textContent=x.rating?('★ '+x.rating+'/10'):'';let h=card.querySelector('.heart');h.textContent=x.favorite?'♥':'♡';h.classList.toggle('on',x.favorite);h.onclick=()=>{x.favorite=!x.favorite;persist()};card.querySelector('.edit').onclick=()=>openEdit(x);$('grid').appendChild(card)})}
function openEdit(x){editId=x?x.id:null;$('modalTitle').textContent=x?'Modifier l’anime':'Ajouter un anime';$('title').value=x?.title||'';$('status').value=x?.status||'Vu';$('rating').value=x?.rating||'';$('notes').value=x?.notes||'';$('favorite').checked=!!x?.favorite;$('modal').classList.add('open')}
function close(){ $('modal').classList.remove('open')}
$('add').onclick=()=>openEdit(null);$('cancel').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};
$('animeForm').onsubmit=e=>{e.preventDefault();let obj={title:$('title').value.trim(),status:$('status').value,rating:Number($('rating').value)||0,notes:$('notes').value.trim(),favorite:$('favorite').checked};if(!obj.title)return;if(editId!==null){let x=items.find(x=>x.id===editId);if(x)Object.assign(x,obj)}else{obj.id=Math.max(0,...items.map(x=>x.id))+1;items.push(obj)}persist();close()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;page=0;document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));draw()});
$('search').oninput=()=>{page=0;draw()};$('sort').onchange=()=>{page=0;draw()};$('favoritesOnly').onclick=()=>{favOnly=!favOnly;$('favoritesOnly').textContent=favOnly?'♥ Afficher toute la liste':'♡ Voir mes favoris';page=0;draw()};
$('prev').onclick=()=>{page=Math.max(0,page-1);draw()};$('next').onclick=()=>{page++;draw()};
function exportData(){let blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sakura-anime-sauvegarde.json';a.click();URL.revokeObjectURL(url)}
$('save').onclick=exportData;$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d))throw Error('Format invalide');if(!confirm('Restaurer '+d.length+' anime(s) ? Cela remplacera la bibliothèque actuelle.'))return;items=d.map(norm);persist();alert('Sauvegarde restaurée !')}catch(err){alert('Impossible de lire ce fichier JSON.')}e.target.value=''};
